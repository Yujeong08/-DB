<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>재고관리</title><style>
:root{--bg:#f3f5f7;--card:#fff;--text:#15171b;--muted:#68707c;--line:#e2e6ea;--blue:#1769e0;--green:#14834a;--red:#cf3737;--amber:#9b6412}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}.app{max-width:640px;margin:auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:10;background:rgba(243,245,247,.95);backdrop-filter:blur(14px);padding:20px 16px 12px}.title{display:flex;justify-content:space-between;align-items:center}.title h1{margin:0;font-size:29px}.gear{width:46px;height:46px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:20px}.sub,.sync{color:var(--muted);font-size:13px}.sync{margin-top:5px}.sync.bad{color:var(--red)}.search{height:54px;margin-top:14px;border:1px solid var(--line);border-radius:15px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px}.search input{width:100%;border:0;outline:0;font-size:17px;background:transparent}.content{padding:0 16px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}.quick button{min-height:96px;border:0;border-radius:18px;color:#fff;text-align:left;padding:17px 14px;font-size:20px;font-weight:900}.quick small{display:block;font-size:13px;margin-top:7px;opacity:.9}.in{background:var(--green)}.out{background:var(--blue)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.sum{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.sum span{font-size:13px;color:var(--muted)}.sum b{display:block;font-size:23px;margin-top:3px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-size:15px;font-weight:800}.chip.active{background:#111827;color:#fff}.section{font-size:18px;font-weight:900;margin:5px 2px 10px}.group{margin-bottom:17px}.gname{font-size:14px;font-weight:900;color:#4b5563;margin:8px 4px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:9px}.row{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:900}.meta{font-size:13px;color:var(--muted);margin-top:5px}.stock{font-size:25px;font-weight:900;white-space:nowrap}.unit{font-size:12px;color:var(--muted);margin-left:2px}.badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.badge{border-radius:999px;padding:5px 8px;font-size:12px;font-weight:900}.ok{background:#eef8f2;color:var(--green)}.low{background:#fff0f0;color:var(--red)}.exp{background:#fff5e6;color:var(--amber)}.actions{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px;margin-top:14px}.act{height:50px;border:1px solid var(--line);border-radius:12px;background:#fafbfc;font-size:16px;font-weight:900}.act.o{color:var(--blue)}.act.i{color:var(--green)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(640px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav{border:0;background:transparent;padding:7px;font-size:13px;font-weight:800;color:#6b7280}.nav.active{color:var(--blue)}.nav b{display:block;font-size:21px}.wrap{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:min(640px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px 28px}.sheet h2{margin:0;font-size:22px}.current{font-size:14px;color:var(--muted);margin:5px 0 14px}.label{font-size:14px;font-weight:900;color:#4b5563;margin:11px 2px 7px}.direct{height:66px;border:2px solid #d7dce2;border-radius:15px;padding:0 14px;display:flex;align-items:center;gap:10px}.direct:focus-within{border-color:var(--blue)}.direct input{width:100%;border:0;outline:0;font-size:31px;font-weight:900}.direct span{font-size:14px;font-weight:900;color:var(--muted)}.number{background:#f5f7f9;border-radius:16px;padding:15px;text-align:center;font-size:32px;font-weight:900;margin:9px 0}.fast{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.fast button{height:45px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:15px;font-weight:900}.preview{padding:13px 14px;background:#f7f8fa;border-radius:13px;margin:10px 0 12px;line-height:1.5}.field{width:100%;height:54px;border:1px solid var(--line);border-radius:13px;padding:0 13px;font-size:17px}.save{width:100%;height:58px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:18px;font-weight:900;margin-top:12px}.save.green{background:var(--green)}.cancel{width:100%;height:44px;border:0;background:transparent;color:var(--muted);font-weight:800}.log{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:8px}.logtop{display:flex;justify-content:space-between}.logname{font-weight:900}.delta{font-size:18px;font-weight:900}.plus{color:var(--green)}.minus{color:var(--blue)}.logmeta{font-size:12px;color:var(--muted);margin-top:5px}.hidden{display:none!important}.empty{padding:40px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);background:#111827;color:#fff;border-radius:999px;padding:11px 16px;font-weight:800;opacity:0;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><div class="app"><header class="top"><div class="title"><div><h1>재고관리</h1><div class="sub">빠르게 찾고, 바로 입출고하세요</div></div><button class="gear" onclick="settings()">⚙️</button></div><div id="sync" class="sync">동기화 중…</div><div class="search">🔎 <input id="search" placeholder="품목명 또는 브랜드 검색"></div></header><main class="content"><section id="home"><div class="quick"><button class="in" onclick="focusMode('in')">＋ 입고 등록<small>들어온 물건 수량 추가</small></button><button class="out" onclick="focusMode('out')">－ 출고 등록<small>납품한 수량 바로 차감</small></button></div><div class="summary"><div class="sum"><span>재고 부족</span><b id="lowCount">0건</b></div><div class="sum"><span>전체 품목</span><b id="allCount">0개</b></div></div><div class="chips" id="chips"></div><div class="section" id="section">전체 재고</div><div id="list"></div></section><section id="logview" class="hidden"><div class="section">최근 변경 내역</div><div id="logs"></div></section></main></div><nav class="bottom"><button class="nav active" onclick="view('home',this)"><b>⌂</b>홈</button><button class="nav" onclick="view('home',this);focusMode('out')"><b>⇄</b>입출고</button><button class="nav" onclick="view('logs',this)"><b>≡</b>기록</button></nav>
<div id="moveWrap" class="wrap" onclick="if(event.target===this)closeMove()"><div class="sheet"><h2 id="moveTitle"></h2><div id="current" class="current"></div><div id="pallet"></div><div class="label" id="modeLabel">출고 수량</div><div class="direct"><input id="qty" type="number" min="0" inputmode="numeric" placeholder="예: 480"><span id="qtyUnit">박스</span></div><div class="number" id="qtyShow">0</div><div class="fast"><button onclick="plus(1)">+1</button><button onclick="plus(5)">+5</button><button onclick="plus(10)">+10</button><button onclick="plus(20)">+20</button><button onclick="plus(50)">+50</button></div><div class="preview" id="after"></div><div class="label">메모 (선택)</div><input id="memo" class="field" placeholder="예: 까르띠에 납품"><button id="moveSave" class="save" onclick="saveMove()">출고 완료</button><button class="cancel" onclick="closeMove()">취소</button></div></div>
<div id="detailWrap" class="wrap" onclick="if(event.target===this)closeDetail()"><div class="sheet"><h2 id="detailTitle"></h2><div id="detailCurrent" class="current"></div><div class="label">현재 재고 수정 (실사)</div><input id="count" class="field" type="number" min="0" inputmode="numeric"><div class="label">안전재고</div><input id="par" class="field" type="number" min="0" inputmode="numeric"><div class="label">유통기한</div><input id="expiry" class="field" type="date"><button class="save" onclick="saveDetail()">저장</button><button class="cancel" onclick="closeDetail()">취소</button></div></div>
<div id="settingsWrap" class="wrap" onclick="if(event.target===this)closeSettings()"><div class="sheet"><h2>앱 설정</h2><div class="label">처리자 이름</div><input id="actor" class="field" placeholder="예: 아빠 / 유정"><div class="label">Apps Script 웹앱 URL</div><input id="apiInput" class="field"><button class="save" onclick="saveSettings()">설정 저장</button><button class="cancel" onclick="closeSettings()">취소</button></div></div><div id="toast" class="toast"></div>
<script>
const API_DEFAULT='https://script.google.com/macros/s/AKfycbyPyhO7an8uxw7vjWVtR57rIQSLwWE4RPBWemnPnwBUbKHtQ6sbqkKOxdOKbuRqh23h/exec',POLL=4000,CATS=['전체','생수','탄산수','주스','티','기타'],PAL={aq025:75,ev033:72,ev_rosca:56,pr02:120,sp025:120,rauch_orange:130,rauch_mango:130,rauch_peach_sp:130,rauch_straw:130,galv_lemonade:88};let items=[],logs=[],cat='전체',q='',sel=null,mode='out',amount=0,detail=null;const $=x=>document.getElementById(x),api=()=>localStorage.inventory_api_url||API_DEFAULT,who=()=>localStorage.inventory_actor||'';
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}function status(s,b=false){$('sync').textContent=s;$('sync').classList.toggle('bad',b)}function norm(x){return {...x,stock:Number(x.stock||0),par:Number(x.par||0),expiry:x.expiry&&String(x.expiry).slice(0,10)!=='NaT'?String(x.expiry).slice(0,10):'',pallet:PAL[x.id]||0}}function exp(d){if(!d)return null;let a=new Date(d+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);let z=Math.ceil((a-n)/864e5);return z<0?['경과 '+(-z)+'일','low']:z<=30?['D-'+z,'exp']:null}
function render(){items=items.map(norm);$('allCount').textContent=items.length+'개';$('lowCount').textContent=items.filter(x=>x.stock<=x.par).length+'건';$('chips').innerHTML=CATS.map(x=>`<button class="chip ${x===cat?'active':''}" onclick="cat='${x}';render()">${x}</button>`).join('');let a=items.filter(x=>(cat==='전체'||x.category===cat)&&(!q||(x.name+' '+x.group).toLowerCase().includes(q.toLowerCase())));$('section').textContent=q?`검색 결과 ${a.length}개`:cat==='전체'?'전체 재고':cat;let g={};a.forEach(x=>(g[x.group]??=[]).push(x));$('list').innerHTML=a.length?Object.entries(g).map(([k,v])=>`<div class="group"><div class="gname">${k}</div>${v.map(x=>{let e=exp(x.expiry);return `<div class="item"><div class="row"><div><div class="name">${x.name}</div><div class="meta">${x.pallet?`${Math.floor(x.stock/x.pallet)} 파렛트 + ${x.stock%x.pallet} 박스 · 1파렛트 ${x.pallet}박스`:`안전재고 ${x.par}${x.unit}`}</div><div class="badges"><span class="badge ${x.stock<=x.par?'low':'ok'}">${x.stock<=x.par?'부족':'정상'}</span>${e?`<span class="badge ${e[1]}">${e[0]}</span>`:''}</div></div><div class="stock">${x.stock.toLocaleString()}<span class="unit">${x.unit}</span></div></div><div class="actions"><button class="act o" onclick="openMove('${x.id}','out')">－ 출고</button><button class="act i" onclick="openMove('${x.id}','in')">＋ 입고</button><button class="act" onclick="openDetail('${x.id}')">⋯</button></div></div>`}).join('')}</div>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}
$('search').oninput=e=>{q=e.target.value;render()};function focusMode(m){mode=m;$('search').placeholder=m==='in'?'입고할 품목 검색':'출고할 품목 검색';$('search').focus();scrollTo({top:0,behavior:'smooth'})}function view(v,b){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('home').classList.toggle('hidden',v==='logs');$('logview').classList.toggle('hidden',v!=='logs');if(v==='logs')loadLogs()}
function openMove(id,m){sel=items.find(x=>x.id===id);mode=m;amount=0;$('moveTitle').textContent=sel.name;$('current').textContent=`현재 재고 ${sel.stock.toLocaleString()} ${sel.unit}`;$('modeLabel').textContent=m==='in'?'입고 수량':'출고 수량';$('qty').value='';$('qtyUnit').textContent=sel.unit;$('memo').value='';$('moveSave').textContent=m==='in'?'입고 완료':'출고 완료';$('moveSave').className='save'+(m==='in'?' green':'');$('pallet').innerHTML=sel.pallet?`<div class="preview">1파렛트 = <b>${sel.pallet}박스</b><br>현재 ${Math.floor(sel.stock/sel.pallet)}파렛트 + ${sel.stock%sel.pallet}박스</div>`:'';updateAmount();$('moveWrap').style.display='flex'}function closeMove(){$('moveWrap').style.display='none'}$('qty').oninput=e=>{amount=Math.max(0,parseInt(e.target.value)||0);updateAmount()};function plus(n){amount+=n;$('qty').value=amount;updateAmount()}function updateAmount(){if(!sel)return;$('qtyShow').textContent=amount.toLocaleString()+' '+sel.unit;let n=mode==='in'?sel.stock+amount:Math.max(0,sel.stock-amount),p=sel.pallet?`<br><small>≈ ${Math.floor(n/sel.pallet)}파렛트 + ${n%sel.pallet}박스</small>`:'';$('after').innerHTML=`처리 후 재고 <b>${n.toLocaleString()} ${sel.unit}</b>${p}`}
async function post(x){let r=await fetch(api(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(x)});return r.json()}async function saveMove(){if(!amount)return toast('수량을 입력해주세요');if(mode==='out'&&amount>sel.stock)return toast('현재 재고보다 많이 출고할 수 없습니다');let delta=mode==='in'?amount:-amount,note=[who()?`처리자: ${who()}`:'',$('memo').value].filter(Boolean).join(' · ');try{closeMove();await post({action:'adjust',id:sel.id,name:sel.name,mode:'add',value:delta,note});await load();toast(mode==='in'?'입고 처리 완료':'출고 처리 완료')}catch(e){toast('저장 실패');status('저장 실패',true)}}
function openDetail(id){detail=items.find(x=>x.id===id);$('detailTitle').textContent=detail.name;$('detailCurrent').textContent=`현재 ${detail.stock.toLocaleString()} ${detail.unit}`;$('count').value=detail.stock;$('par').value=detail.par;$('expiry').value=detail.expiry||'';$('detailWrap').style.display='flex'}function closeDetail(){$('detailWrap').style.display='none'}async function saveDetail(){let stock=Math.max(0,Number($('count').value||0)),par=Math.max(0,Number($('par').value||0)),expiry=$('expiry').value||'';try{closeDetail();if(stock!==detail.stock)await post({action:'adjust',id:detail.id,name:detail.name,mode:'set',value:stock,note:[who()?`처리자: ${who()}`:'','실사/직접수정'].filter(Boolean).join(' · ')});await post({action:'saveMeta',id:detail.id,par,expiry});await load();toast('품목 정보 저장 완료')}catch(e){toast('저장 실패')}}
function settings(){$('actor').value=who();$('apiInput').value=api();$('settingsWrap').style.display='flex'}function closeSettings(){$('settingsWrap').style.display='none'}function saveSettings(){localStorage.inventory_actor=$('actor').value.trim();localStorage.inventory_api_url=$('apiInput').value.trim()||API_DEFAULT;closeSettings();load();toast('설정 저장 완료')}
async function load(){try{let r=await fetch(api()+'?action=stock&_='+Date.now()),d=await r.json(),a=Array.isArray(d)?d:d.items;if(Array.isArray(a)){items=a.map(norm);render();status('Google Sheets 동기화 완료')}}catch(e){status('동기화 실패 — 네트워크 확인',true)}}async function loadLogs(){try{let r=await fetch(api()+'?action=log&_='+Date.now()),d=await r.json();logs=Array.isArray(d)?d:(d.logs||[]);$('logs').innerHTML=logs.length?logs.slice(0,100).map(l=>{let v=Number(l.delta??l.value??0),after=l.resulting??l.after??'';return `<div class="log"><div class="logtop"><div class="logname">${l.name||l.id||''}</div><div class="delta ${v>=0?'plus':'minus'}">${v>=0?'+':''}${v}</div></div><div class="logmeta">${l.ts||l.time||''}${l.note?' · '+l.note:''}${after!==''?`<br>처리 후 ${after}`:''}</div></div>`}).join(''):'<div class="empty">표시할 기록이 없습니다.</div>'}catch(e){$('logs').innerHTML='<div class="empty">기록을 불러오지 못했습니다.</div>'}}
load();setInterval(load,POLL);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
